# 三猫书桌 · CI：构建 Web + APK，验证测试。
# Web 产物部署到 Cloudflare Pages（见下方 deploy job）。
# canvaskit 坑由 scripts/build_web.sh 内部的 fix_canvaskit.py 自动处理。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # 先生成示例 .smpack（往返测试的输入）
      - run: dart run tool/make_pack.dart tool/packs/kaoyan_art.yaml
      - run: flutter test

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: bash scripts/build_web.sh
        env:
          BASE_HREF: /three-cats-desk/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Windows 桌面版（本地专属版主力交付形态，2026-08-13）。
  # 产出便携 zip（含 exe + 全部 dll + data），客户解压双击即用。
  # 本地专属模式默认开启（AppMode 默认 local），无需 --dart-define。
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      # 打包 Release 目录成 zip（exe + flutter_windows.dll + data/ 全套）
      - name: Zip portable package
        run: |
          $src = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "three_cats_desk-windows.zip" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: app-windows-portable
          path: three_cats_desk-windows.zip

  # .smpack 示例资源包（卖家端生成器产出 + 往返测试在 test job 先跑生成）。
  build-pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
      - run: flutter pub get
      - run: dart run tool/make_pack.dart tool/packs/kaoyan_art.yaml
      - uses: actions/upload-artifact@v6
        with:
          name: sample-smpack-kaoyan-art
          path: build/packs/kaoyan_art.smpack
